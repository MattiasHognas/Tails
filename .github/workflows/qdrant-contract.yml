name: Qdrant contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6333/readyz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify indexer and storage contract
        run: cargo test --locked -p rag-core -p rag-indexer
      - name: Verify real Qdrant round trip
        env:
          QDRANT_TEST_ENDPOINT: http://localhost:6333
        run: cargo test --locked -p rag-core --test qdrant_roundtrip -- --ignored
