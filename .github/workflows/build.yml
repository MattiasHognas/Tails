name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Real Qdrant for the storage contract tests (ignored by default locally).
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    env:
      QDRANT_TEST_ENDPOINT: http://localhost:6333

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.90
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-all-crates: true

    - name: Build release binaries
      run: cargo build --workspace --release --locked

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    # Every test runs once, instrumented; a failing test fails this step.
    - name: Test workspace
      run: cargo llvm-cov --workspace --all-features --locked --no-report

    - name: Wait for Qdrant
      run: |
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://localhost:6333/readyz; then
            exit 0
          fi
          sleep 1
        done
        echo "Qdrant did not become ready" >&2
        exit 1

    - name: Test against real Qdrant
      run: cargo llvm-cov --package rag-core --test qdrant_roundtrip --all-features --locked --no-report -- --ignored

    # Indexer writer -> Qdrant -> /ask reader, including the incident question set.
    # Each test is named exactly; the opt-in OpenAI variant is never selected.
    - name: Test the pipeline against real Qdrant
      run: >-
        cargo llvm-cov --package rag-indexer --bin rag-indexer --all-features --locked --no-report --
        --ignored --exact
        pipeline_tests::contract::pipeline_contract_real_qdrant
        pipeline_tests::unicode::unicode_round_trip_real_qdrant
        pipeline_tests::quality::incident_questions_real_qdrant

    - name: Generate code coverage
      run: cargo llvm-cov report --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
