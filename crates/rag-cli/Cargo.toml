[package]
name = "rag-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
iana-time-zone = "0.1.65"
chrono = "0.4.45"
chrono-tz = "0.10.4"
anstyle = "1.0.14"
terminal_size = "0.4.4"

[dev-dependencies]
wiremock = "0.6.5"
