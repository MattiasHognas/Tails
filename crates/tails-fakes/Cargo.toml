[package]
name = "tails-fakes"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test fakes (Datadog API, OpenAI chat) and the incident question set, shared by the in-process pipeline tests and the end-to-end run of the built binaries."

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.6.0", features = ["derive"] }
rag-core = { path = "../rag-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "process", "signal", "net"] }
urlencoding = "2.1.3"
wiremock = "0.6.5"
